[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-os-agent"
version = "1.0.0"
description = "Voice-controlled OS agent: a fine-tuned T5 model turns natural-language requests into validated, safely executed system actions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mokhtar Benkirane" }, { name = "Rabie Ermoug" }, { name = "Firas Mahboub" }]

[project.scripts]
voice-os-agent = "voice_os_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["_archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B023", "E501"]  # line length is handled by `ruff format`
